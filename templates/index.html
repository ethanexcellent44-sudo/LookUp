<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFEGUARD NEXUS - Visual Intelligence Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #07090f 0%, #0b0e18 100%);
            color: #e2e8f0;
            font-family: 'Consolas', 'Monaco', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(26, 37, 64, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 37, 64, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: -1;
            animation: slideGrid 20s linear infinite;
        }

        @keyframes slideGrid {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .container {
            text-align: center;
            max-width: 800px;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.4));
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse-indicator 2s infinite;
        }

        @keyframes pulse-indicator {
            0%, 100% {
                box-shadow: 0 0 10px #00ff88;
                opacity: 1;
            }
            50% {
                box-shadow: 0 0 20px #00ff88;
                opacity: 0.6;
            }
        }

        h1 {
            font-size: 48px;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: slideDown 0.8s ease-out;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 40px;
            animation: slideUp 0.8s ease-out 0.1s backwards;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 40px;
            animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .feature {
            background: rgba(15, 20, 34, 0.6);
            border: 1px solid #1a2540;
            border-radius: 8px;
            padding: 15px;
            font-size: 11px;
            color: #718096;
            transition: all 0.3s ease;
        }

        .feature:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.1);
        }

        .feature-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            animation: slideUp 0.8s ease-out 0.3s backwards;
        }

        .card {
            background: #0f1422;
            border: 2px solid #1a2540;
            border-radius: 12px;
            padding: 35px 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
        }

        .card-icon {
            font-size: 48px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 11px;
            color: #718096;
            text-align: center;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #4a5568;
            font-size: 11px;
            margin-top: 50px;
            animation: slideUp 0.8s ease-out 0.4s backwards;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #00ff88;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1024px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .button-grid, .features {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="logo-container">
            <div class="logo">⬡</div>
            <h1 class="glitch" data-text="SAFEGUARD NEXUS">SAFEGUARD NEXUS
                <span class="status-indicator"></span>
            </h1>
        </div>

        <p class="subtitle">Visual Intelligence Platform v4.0</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔐</div>
                <div>Advanced Face Recognition</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div>Real-time Analytics</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚨</div>
                <div>Security Alerts</div>
            </div>
        </div>

        <div class="button-grid">
            <a href="/gate-entry" class="card">
                <div class="card-icon">🚪</div>
                <div class="card-title">Gate Entry</div>
                <div class="card-desc">Check in visitors</div>
            </a>

            <a href="/dashboard" class="card">
                <div class="card-icon">📊</div>
                <div class="card-title">Dashboard</div>
                <div class="card-desc">Admin analytics</div>
            </a>

            <a href="/pre-register" class="card">
                <div class="card-icon">📝</div>
                <div class="card-title">Pre-Register</div>
                <div class="card-desc">Schedule visits</div>
            </a>
        </div>

        <div class="footer">
            <span>© 2026 SAFEGUARD NEXUS</span>
            <span>•</span>
            <a href="/dashboard">Admin Login</a>
            <span>•</span>
            <span>Face Recognition Powered by Deep Learning</span>
        </div>
    </div>
</body>
</html>

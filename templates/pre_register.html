<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFEGUARD NEXUS - Pre-Register Visitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #07090f 0%, #0b0e18 100%);
            color: #e2e8f0;
            font-family: 'Consolas', 'Monaco', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(26, 37, 64, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 37, 64, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: #0f1422;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #004d5e;
            padding-bottom: 20px;
        }
        
        .header h1 {
            color: #00d4ff;
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        
        .header p {
            color: #718096;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #718096;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0b0e18;
            border: 1px solid #1a2540;
            color: #e2e8f0;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            background: #0b0e18;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        
        input::placeholder, textarea::placeholder {
            color: #4a5568;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .required {
            color: #ff3d3d;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .btn-submit {
            background: #00d4ff;
            color: #07090f;
        }
        
        .btn-submit:hover:not(:disabled) {
            background: #00a8cc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }
        
        .btn-submit:disabled {
            background: #4a5568;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-clear {
            background: transparent;
            border: 1px solid #ff3d3d;
            color: #ff3d3d;
        }
        
        .btn-clear:hover {
            background: rgba(255, 61, 61, 0.1);
        }
        
        .status-message {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 12px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .status-success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        
        .status-error {
            background: rgba(255, 61, 61, 0.2);
            color: #ff3d3d;
            border: 1px solid #ff3d3d;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #00d4ff;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="container">
        <div class="header">
            <h1>📝 PRE-REGISTER VISITOR</h1>
            <p>Schedule your visit in advance</p>
        </div>
        
        <div class="info-box">
            ℹ️ Pre-registering allows for faster check-in at the gate with automatic face recognition matching.
        </div>
        
        <form id="preregForm">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="purpose">Purpose of Visit <span class="required">*</span></label>
                <select id="purpose" name="purpose" required>
                    <option value="">-- Select Purpose --</option>
                    <option value="Meeting">Business Meeting</option>
                    <option value="Delivery">Delivery</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Service">Service Visit</option>
                    <option value="Event">Event</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="contact">Contact Person <span class="required">*</span></label>
                <input type="text" id="contact" name="contact_person" placeholder="Name of person to meet" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
            </div>
            
            <div class="form-group">
                <label for="date">Expected Date <span class="required">*</span></label>
                <input type="date" id="date" name="expected_date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Expected Time</label>
                <input type="time" id="time" name="expected_time">
            </div>
            
            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" placeholder="Any additional information..."></textarea>
            </div>
            
            <div id="statusMessage" class="status-message"></div>

            <div id="qrResult" class="qr-result" style="display:none; margin-top: 20px; text-align:center;">
                <p style="color:#00ff88; font-size:13px; margin-bottom: 10px;">🟢 Pre-registration complete. Scan this QR code at the gate.</p>
                <img id="qrImage" src="" alt="Pre-registration QR code" style="width: 180px; height: 180px; border-radius: 8px; background:#fff; padding:10px;" />
                <p style="margin-top: 12px; font-size: 12px; color: #cbd5e0;">Code: <code id="qrToken" style="color:#00d4ff;"></code></p>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit" id="submitBtn">Submit Registration</button>
                <button type="reset" class="btn-clear" onclick="resetForm()">Clear</button>
            </div>
        </form>
    </div>
    
    <script>
        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        
        function showStatus(message, isSuccess) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${isSuccess ? 'status-success' : 'status-error'}`;
            statusEl.style.display = 'block';
        }
        
        function resetForm() {
            document.getElementById('preregForm').reset();
            document.getElementById('statusMessage').style.display = 'none';
        }
        
        document.getElementById('preregForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            try {
                const formData = new FormData(this);
                
                const response = await fetch('/api/pre-register', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('✓ Registration submitted successfully! You will be fast-tracked at the gate.', true);
                    const qrResult = document.getElementById('qrResult');
                    document.getElementById('qrImage').src = data.qr_url;
                    document.getElementById('qrToken').textContent = data.qr_token;
                    qrResult.style.display = 'block';
                } else {
                    showStatus(`Error: ${data.error}`, false);
                }
            } catch (e) {
                showStatus(`Error: ${e.message}`, false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration';
            }
        });
    </script>
</body>
</html>
